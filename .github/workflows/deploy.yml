name: Deploy to GitHub Pages

# Live since 2026-08-07 in both ofektaiwan/website and ofekai/website; this file
# is byte-identical in each. The site profile (domain, contact email) comes from
# GITHUB_REPOSITORY_OWNER, see src/data/site-profiles.ts. After any change to
# the Pages source, re-check the custom domain and "Enforce HTTPS" (DEPLOY.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
